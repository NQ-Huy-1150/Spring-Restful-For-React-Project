services:
  app:
    build: .
    ports:
      - "127.0.0.1:8881:8881"
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: life_manager
      MYSQL_USER: lifeapp
      MYSQL_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: life_manager
      MYSQL_USER: lifeapp
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD}}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data: